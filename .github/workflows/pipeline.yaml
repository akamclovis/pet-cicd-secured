name: Pet Clinic CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: pet-clinic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  AWS_REGION: ${{ secrets.AWS_REGION }}
  APP_PORT: "8080"
  ECS_CLUSTER: "pet-clinic-dev-cluster"
  ECS_SERVICE: "pet-clinic-dev-service"
  ECS_CONTAINER_NAME: "pet-clinic"

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan repository for exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build and Unit Test
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and run unit tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-test-results
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload compiled application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maven-target
          path: target/
          if-no-files-found: error
          retention-days: 1

  quality-gate:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Download compiled application
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maven-target
          path: target

      - name: Import Sonar token from Vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          role: pet-clinic-github
          jwtGithubAudience: vault.techlearnx.com
          secrets: |
            secret/data/devsecops-pipeline/sonar SONAR_TOKEN | SONAR_TOKEN

      - name: Run SonarCloud analysis and wait for Quality Gate
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=akamclovis_pet \
          -Dsonar.organization=akamclovis \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.token="${SONAR_TOKEN}" \
          -Dsonar.qualitygate.wait=true

  filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Scan source and dependencies
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  docker-build-and-scan:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - filesystem-scan
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Download compiled application
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maven-target
          path: target

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --no-cache \
            --tag pet-clinic:${{ github.sha }} \
            .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: image
          image-ref: pet-clinic:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Save scanned Docker image
        run: docker save pet-clinic:${{ github.sha }} --output pet-clinic-image.tar

      - name: Upload scanned Docker image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pet-clinic-image
          path: pet-clinic-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-to-ecr:
    name: Publish Image to Amazon ECR
    runs-on: ubuntu-latest
    needs: docker-build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download scanned Docker image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pet-clinic-image

      - name: Load Docker image
        run: docker load --input pet-clinic-image.tar

      - name: Configure temporary AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: pet-clinic-${{ github.run_id }}

      - name: Verify assumed AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - name: Tag and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          LATEST_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          docker tag "pet-clinic:${IMAGE_TAG}" "$IMAGE_URI"
          docker tag "pet-clinic:${IMAGE_TAG}" "$LATEST_URI"

          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

  deploy-to-ecs:
    name: Deploy to Amazon ECS
    runs-on: ubuntu-latest
    needs: publish-to-ecr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure temporary AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: pet-clinic-deploy-${{ github.run_id }}

      - name: Get current ECS task definition
        run: |
          set -euo pipefail

          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current task definition: $TASK_DEFINITION_ARN"

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query 'taskDefinition' \
            --output json > current-task-definition.json

      - name: Prepare new task definition
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Preparing ECS deployment for image tag: $IMAGE_TAG"

          CONTAINER_EXISTS=$(jq \
            --arg CONTAINER "$ECS_CONTAINER_NAME" \
            '[.containerDefinitions[] | select(.name == $CONTAINER)] | length' \
            current-task-definition.json)

          if [ "$CONTAINER_EXISTS" -ne 1 ]; then
            echo "ERROR: Expected exactly one container named '$ECS_CONTAINER_NAME', found $CONTAINER_EXISTS."
            exit 1
          fi

          jq \
            --arg IMAGE "$IMAGE_URI" \
            --arg CONTAINER "$ECS_CONTAINER_NAME" \
            '
            .containerDefinitions |= map(
              if .name == $CONTAINER
              then .image = $IMAGE
              else .
              end
            )
            |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            ' current-task-definition.json \
            > new-task-definition.json

      - name: Register new ECS task definition
        id: register-task-definition
        run: |
          set -euo pipefail

          NEW_TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered task definition: $NEW_TASK_DEFINITION_ARN"
          echo "task_definition_arn=$NEW_TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy new task definition to ECS
        env:
          TASK_DEFINITION_ARN: ${{ steps.register-task-definition.outputs.task_definition_arn }}
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN"

      - name: Wait for ECS service stability
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Verify deployed revision
        run: |
          set -euo pipefail

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount,TaskDefinition:taskDefinition}' \
            --output table