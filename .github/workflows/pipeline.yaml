name: Pet Clinic CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: pet-clinic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  AWS_REGION: ${{ vars.AWS_REGION }}
  APP_PORT: "8080"

jobs:
  build-and-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and run unit tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload compiled application
        uses: actions/upload-artifact@v4
        with:
          name: maven-target
          path: target/
          if-no-files-found: error
          retention-days: 1

  quality-gate:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Download compiled application
        uses: actions/download-artifact@v4
        with:
          name: maven-target
          path: target

      - name: Read SonarCloud token from Vault
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/devsecops-pipeline/sonar SONAR_TOKEN | SONAR_TOKEN

      - name: Run SonarCloud analysis and wait for Quality Gate
        run: |
          mvn --batch-mode --no-transfer-progress sonar:sonar \
            -Dsonar.projectKey=akamclovis_pet-cicd-secured \
            -Dsonar.organization=akamclovis \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

  filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Scan source and dependencies
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  docker-build-and-scan:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - filesystem-scan
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download compiled application
        uses: actions/download-artifact@v4
        with:
          name: maven-target
          path: target

      - name: Build Docker image
        run: docker build --tag pet-clinic:${{ github.sha }} .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: pet-clinic:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Save scanned Docker image
        run: docker save pet-clinic:${{ github.sha }} --output pet-clinic-image.tar

      - name: Upload scanned Docker image
        uses: actions/upload-artifact@v4
        with:
          name: pet-clinic-image
          path: pet-clinic-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-to-ecr:
    name: Publish Image to Amazon ECR
    runs-on: ubuntu-latest
    needs: docker-build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    outputs:
      image-uri: ${{ steps.publish.outputs.image-uri }}

    steps:
      - name: Download scanned Docker image
        uses: actions/download-artifact@v4
        with:
          name: pet-clinic-image

      - name: Load Docker image
        run: docker load --input pet-clinic-image.tar

      - name: Configure temporary AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: pet-clinic-${{ github.run_id }}

      - name: Verify assumed AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image
        id: publish
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          LATEST_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          docker tag "pet-clinic:${IMAGE_TAG}" "$IMAGE_URI"
          docker tag "pet-clinic:${IMAGE_TAG}" "$LATEST_URI"

          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Pet Clinic to EC2
    runs-on: ubuntu-latest
    needs: publish-to-ecr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Read EC2 connection details from Vault
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/devsecops-pipeline/ec2 EC2_HOST    | EC2_HOST ;
            secret/devsecops-pipeline/ec2 EC2_USER    | EC2_USER ;
            secret/devsecops-pipeline/ec2 EC2_SSH_KEY | EC2_SSH_KEY

      - name: Prepare SSH credentials
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > deploy_key.pem
          chmod 600 deploy_key.pem
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Pull and run the ECR image on EC2
        env:
          IMAGE_URI: ${{ needs.publish-to-ecr.outputs.image-uri }}
        run: |
          set -euo pipefail

          ssh -i deploy_key.pem "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$AWS_REGION' '$IMAGE_URI' '$APP_PORT'" <<'REMOTE_SCRIPT'
              set -euo pipefail

              AWS_REGION="$1"
              IMAGE_URI="$2"
              APP_PORT="$3"
              ECR_REGISTRY="${IMAGE_URI%%/*}"

              aws ecr get-login-password --region "$AWS_REGION" |
                sudo docker login \
                  --username AWS \
                  --password-stdin "$ECR_REGISTRY"

              sudo docker pull "$IMAGE_URI"
              sudo docker rm --force pet-clinic 2>/dev/null || true

              sudo docker run --detach \
                --name pet-clinic \
                --restart unless-stopped \
                --publish "${APP_PORT}:8080" \
                "$IMAGE_URI"

              sleep 10

              if [ "$(sudo docker inspect --format='{{.State.Running}}' pet-clinic)" != "true" ]; then
                sudo docker logs pet-clinic
                exit 1
              fi

              sudo docker image prune --force
          REMOTE_SCRIPT

      - name: Remove temporary SSH key
        if: always()
        run: rm -f deploy_key.pem